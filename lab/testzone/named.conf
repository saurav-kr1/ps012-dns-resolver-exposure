// TEST ZONE SERVER: the authoritative server for our private zone lab.test.
// It logs every question so we can see WHO asked for each random probe name.
options {
    directory "/tmp";             // BIND needs a WRITABLE working directory
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    allow-transfer { none; };
    dnssec-validation no;
    querylog yes;
    pid-file "/tmp/named.pid";
};

logging {
    channel qlog {
        file "/logs/query.log" versions 1 size 5m;
        print-time yes;
        print-category yes;
    };
    category queries { qlog; };
    category default { default_stderr; };
};

zone "lab.test" {
    type master;
    file "/etc/bind/db.lab.test";
};
