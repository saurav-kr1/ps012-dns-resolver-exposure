# t01: OPEN resolver (the dangerous kind). Lab use only.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    qname-minimisation: no
    do-not-query-localhost: no
    module-config: "iterator"
    local-zone: "test." nodefault        # Unbound normally answers .test itself; let it recurse instead
    access-control: 0.0.0.0/0 allow      # <-- anyone may use recursion

# in the isolated lab there is no Internet, so lab.test is found through our test zone server
stub-zone:
    name: "lab.test"
    stub-addr: 172.30.0.2
