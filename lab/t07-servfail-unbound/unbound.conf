# t07: open resolver with a BROKEN upstream. It is willing to recurse for anyone,
# but its only route to lab.test points at t06 (nothing listening), so it answers SERVFAIL.
# This is the "ambiguous" case: the tool must say INCONCLUSIVE, not "not recursive".
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    qname-minimisation: no
    do-not-query-localhost: no
    module-config: "iterator"
    local-zone: "test." nodefault
    access-control: 0.0.0.0/0 allow

stub-zone:
    name: "lab.test"
    stub-addr: 172.30.0.16
