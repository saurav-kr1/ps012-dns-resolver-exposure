# t05: INTERFACE-RESTRICTED resolver (RFC 5358 Method 2).
# It listens ONLY on its lab-side address, so nothing answers on the address the probe client uses.
server:
    verbosity: 1
    interface: 172.30.0.15               # <-- only this interface
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    qname-minimisation: no
    do-not-query-localhost: no
    module-config: "iterator"
    local-zone: "test." nodefault
    access-control: 0.0.0.0/0 allow

stub-zone:
    name: "lab.test"
    stub-addr: 172.30.0.2
