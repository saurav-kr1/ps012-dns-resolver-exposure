# t03: RESTRICTED resolver (RFC 5358 Method 1, IP ACL). Only the lab network may use it.
# The probe client sits on a DIFFERENT network (172.31.0.x), so it is a stranger -> REFUSED.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    qname-minimisation: no
    do-not-query-localhost: no
    module-config: "iterator"
    local-zone: "test." nodefault
    access-control: 127.0.0.0/8 allow
    access-control: 172.30.0.0/24 allow   # intended clients only
    access-control: 0.0.0.0/0 refuse      # everyone else is refused

stub-zone:
    name: "lab.test"
    stub-addr: 172.30.0.2
