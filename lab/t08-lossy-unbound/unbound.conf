# t08: an OPEN resolver on a LOSSY network (packet loss is injected by tc/netem in docker-compose.yml).
# It really is recursive, but some of its replies never arrive, so the tool must rely on
# retries and the majority vote to still label it correctly.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    qname-minimisation: no
    do-not-query-localhost: no
    module-config: "iterator"
    local-zone: "test." nodefault
    access-control: 0.0.0.0/0 allow

stub-zone:
    name: "lab.test"
    stub-addr: 172.30.0.2
