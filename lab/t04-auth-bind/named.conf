// t04: AUTHORITATIVE-ONLY server (RFC 5358: "turn recursion off completely").
options {
    directory "/tmp";             // BIND needs a WRITABLE working directory
    listen-on { any; };
    listen-on-v6 { none; };
    recursion no;                 // never look things up for others
    allow-query { any; };         // but must answer everyone about its own zone
    allow-transfer { none; };
    dnssec-validation no;
    pid-file "/tmp/named.pid";
};

zone "example-lab.test" {
    type master;
    file "/etc/bind/db.example-lab.test";
};
